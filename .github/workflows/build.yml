name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: nginx-php
      folders: |
        8.2
        8.3
        8.4
        8.5
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        php${FOLDER}
        php${FOLDER}-${VERSION_MAJOR}
        php${FOLDER}-${VERSION_MINOR}
        php${FOLDER}-${VERSION}
        php${PHP_REVISION}
        php${PHP_REVISION}-${VERSION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
